# 로컬 개발용 PostgreSQL. 개발 PC에서만 접근하고, API와 worker는 PC의 프로세스로 돈다.
name: taki
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taki
      POSTGRES_PASSWORD: taki-local-dev
      POSTGRES_DB: taki
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - taki-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taki -d taki"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  taki-pg:
