# 서버(taki-server)용. dev·main으로 가는 PR과 dev push에서 린트와 시험을 돌린다.
# DB 없이 도는 시험만 실행하므로 비밀값이 필요 없다. postgres 시험은 제외된다(pyproject.toml). 엔진은 잠금 파일의 고정 버전을 GitHub에서 받는다.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정한다(태그는 옮겨질 수 있다).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
