[project]
name = "taki-server"
version = "0.1.0"
description = "TAKI 진단 엔진의 로컬 API·worker·결과 저장소"
requires-python = ">=3.12"
dependencies = [
  "taki @ git+https://github.com/what-is-your-vulnerability/Threat-Analysis-Knowledge-Intelligence@v0.2.0",
  "fastapi>=0.162.2",
  "uvicorn>=0.54.0",
  "sqlalchemy>=2.1.8",
  "alembic>=1.20.1",
  "psycopg[binary]>=3.3.8",
]

[project.scripts]
taki-server = "taki_server.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/taki_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DB가 필요한 시험은 -m postgres로 따로 돌린다.
addopts = "-m 'not postgres'"
# langsmith 패키지가 자기 내부 모듈을 불러올 때 내는 경고다. 우리 코드와 무관하다.
filterwarnings = ["ignore:langsmith.wrappers._openai_agents is deprecated:DeprecationWarning"]
markers = ["postgres: 로컬 PostgreSQL이 필요한 시험"]

[tool.ruff]
line-length = 120
# 시험용 Java 예제 프로젝트. Python 파일은 없지만 진단 대상 원본이라 검사에서 뺀다.
extend-exclude = ["tests/fixtures"]
# pre-commit은 파일 이름을 직접 넘긴다. 이 설정이 없으면 extend-exclude가 무시된다.
force-exclude = true

[tool.ruff.lint]
# 기본(E4·E7·E9·F)에 추가. 괄호는 대응하는 flake8 플러그인
extend-select = [
  "E", "W",   # pycodestyle
  "B",        # flake8-bugbear
  "S",        # flake8-bandit
  "I",        # isort
  "C4",       # flake8-comprehensions
  "SIM",      # flake8-simplify
  "PT",       # flake8-pytest-style
  "N",        # pep8-naming
  "PIE",      # flake8-pie
  "RET",      # flake8-return
  "BLE",      # flake8-blind-except
  "DTZ",      # flake8-datetimez
  "PTH",      # flake8-use-pathlib
  "C90",      # mccabe
  "RUF",      # Ruff 자체 규칙
]
# PT018: assert 하나에 조건 여러 개를 쓰지 말라는 스타일 규칙. 버그를 잡지 않는다.
ignore = ["PT018"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # 시험 코드의 assert는 정상

[tool.mypy]
# 커밋마다 같은 결과가 나오도록 바뀐 파일이 아니라 src 전체를 본다.
files = ["src"]
ignore_missing_imports = true
